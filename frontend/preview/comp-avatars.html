<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#fff;padding:24px;color:var(--ink-900)}
  .row{display:flex;gap:36px;align-items:center}
  .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
  .stack{display:flex;align-items:center}
  .stack .av{box-shadow:0 0 0 2.5px #fff;width:34px;height:34px;font-size:12px}
  .stack .av+.av,.stack .plus{margin-left:-11px}
  .plus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink-400);font-weight:600;font-size:13px;box-shadow:0 0 0 2.5px #fff,var(--shadow-sm)}
  .cap{font-size:10px;font-family:ui-monospace,monospace;color:var(--ink-500);margin-top:10px}
  .meta{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
  svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="row">
  <div><div class="av" style="background:var(--primary-grad)">TW</div><div class="cap">avatar</div></div>
  <div>
    <div class="stack">
      <div class="av" style="background:#FBC04C;z-index:3">AB</div>
      <div class="av" style="background:#82CF7E;z-index:2">CD</div>
      <div class="plus">+3</div>
    </div>
    <div class="cap">avatar stack</div>
  </div>
  <div style="display:flex;gap:10px">
    <span class="meta" style="background:var(--primary-100);color:var(--primary-500)"><svg width="16" height="16" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span>
    <span class="meta" style="background:var(--green-100);color:var(--green-500)"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></span>
    <span class="meta" style="background:var(--card-lilac);color:#9579C4"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
  </div>
</div>
</body></html>

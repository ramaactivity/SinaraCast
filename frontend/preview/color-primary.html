<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font);background:#fff;padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:14px;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;box-shadow:var(--shadow-sm)}
  .name{font-size:11px;font-weight:600}
  .hex{font-size:10px;font-family:ui-monospace,monospace;opacity:.8}
  .grad{margin-top:12px;height:54px;border-radius:14px;background:var(--primary-grad);display:flex;align-items:flex-end;padding:10px 14px;color:#fff;font-size:11px;font-weight:600;box-shadow:var(--shadow-primary)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--primary-100)"><span class="name" style="color:#C98A2A">100</span><span class="hex" style="color:#C98A2A">#FFF3D6</span></div>
  <div class="sw" style="background:var(--primary-200)"><span class="name" style="color:#B07B22">200</span><span class="hex" style="color:#B07B22">#FFE4A8</span></div>
  <div class="sw" style="background:var(--primary-300)"><span class="name" style="color:#8A5E14">300</span><span class="hex" style="color:#8A5E14">#FED174</span></div>
  <div class="sw" style="background:var(--primary-400)"><span class="name" style="color:#fff">400</span><span class="hex" style="color:#fff">#FCC04C</span></div>
  <div class="sw" style="background:var(--primary-500)"><span class="name" style="color:#fff">500</span><span class="hex" style="color:#fff">#F9A826</span></div>
</div>
<div class="grad">--primary-grad &nbsp;·&nbsp; #FFD66B → #F9A826</div>
</body></html>

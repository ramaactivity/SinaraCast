<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#F6F5FB;padding:22px;color:var(--ink-900);display:flex;gap:14px}
  .ev{flex:1;border-radius:16px;padding:15px 17px;box-shadow:0 8px 20px rgba(90,96,120,.08)}
  .ttl{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
  .dot{width:7px;height:7px;border-radius:50%}
  .pub{font-size:10.5px;color:rgba(62,67,81,.55);margin:3px 0 11px 16px}
  .meta{display:flex;align-items:center;gap:6px;margin-left:16px;font-size:10.5px;color:rgba(62,67,81,.7);margin-top:5px}
  svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="ev" style="background:var(--card-yellow)">
  <div class="ttl"><span class="dot" style="background:#E0922A"></span>Introduction to UX Design</div>
  <div class="pub">Public</div>
  <div class="meta" style="margin-top:0"><svg width="13" height="13" viewBox="0 0 24 24" style="color:#E0922A"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>8.00pm - 9.15pm</div>
  <div class="meta"><svg width="13" height="13" viewBox="0 0 24 24" style="color:#E0922A"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6"/></svg>Joya Hotel, Kaliurang</div>
</div>
<div class="ev" style="background:var(--card-mint)">
  <div class="ttl"><span class="dot" style="background:#5FBE6B"></span>Introduction to UI Design</div>
  <div class="pub">Public</div>
  <div class="meta" style="margin-top:0"><svg width="13" height="13" viewBox="0 0 24 24" style="color:#5FBE6B"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>10.00pm - 11.00pm</div>
  <div class="meta"><svg width="13" height="13" viewBox="0 0 24 24" style="color:#5FBE6B"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6"/></svg>Queen Hotel, Yogyakarta</div>
</div>
</body></html>

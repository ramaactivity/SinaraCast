<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#F6F5FB;padding:24px;color:var(--ink-900)}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  button{font-family:var(--font);border:none;cursor:pointer}
  .green{height:48px;padding:0 30px;border-radius:14px;background:var(--green-grad);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow-green)}
  .ghost{height:48px;padding:0 26px;border-radius:14px;background:#fff;color:var(--ink-700);font-weight:600;font-size:14px;box-shadow:var(--shadow-sm)}
  .icon{width:50px;height:50px;border-radius:15px;background:var(--primary-grad);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-primary)}
  .pill{height:40px;padding:0 20px;border-radius:999px;background:#fff;color:var(--ink-500);font-size:13px;display:inline-flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm)}
  svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="row">
  <button class="green">Reschedule</button>
  <button class="ghost">Secondary</button>
  <button class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
  <span class="pill"><svg width="17" height="17" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Search</span>
</div>
</body></html>

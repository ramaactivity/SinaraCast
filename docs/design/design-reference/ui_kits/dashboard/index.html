<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ca Schedule — Dashboard</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--app-bg);
    min-height: 100vh;
    overflow: hidden;
    color: var(--ink-900);
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #root { position: absolute; top: 50%; left: 50%; width: 1180px; transform-origin: center center; }
  .app-shell {
    display: flex;
    background: rgba(255,255,255,.30);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid rgba(255,255,255,.5);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    min-height: 760px;
  }
  .main {
    flex: 1;
    padding: 28px 30px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .tz {
    display: inline-flex; align-items: center; gap: 14px; align-self: flex-start;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 9px 16px; box-shadow: var(--shadow-sm);
    font-size: 12.5px; color: var(--ink-500);
  }
  .content-grid { display: grid; grid-template-columns: 1fr 296px; gap: 18px; align-items: start; }
  .left-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .right-col { display: flex; flex-direction: column; gap: 18px; }
  .cal-task { display: grid; grid-template-columns: 1fr 248px; gap: 18px; align-items: start; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script>
  function fit() {
    const r = document.getElementById('root');
    const pad = 40;
    const sw = (window.innerWidth - pad) / r.offsetWidth;
    const sh = (window.innerHeight - pad) / r.offsetHeight;
    const s = Math.min(sw, sh, 1);
    r.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', () => { fit(); setTimeout(fit, 400); });
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="widgets.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="panels1.jsx"></script>
<script type="text/babel" src="panels2.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <div className="app-shell" data-screen-label="Dashboard">
      <Sidebar />
      <div className="main">
        <Topbar />
        <div className="tz">
          <span>Time Zone</span>
          <span style={{ color: 'var(--ink-700)', fontWeight: 500 }}>(UTC+07:00) Bangkok, Hanoi, Jakarta</span>
          <Icons.chevDown size={15} style={{ color: 'var(--ink-400)' }} />
        </div>

        <div className="content-grid">
          <div className="left-col">
            <div className="cal-task">
              <Calendar />
              <MyTask />
            </div>
            <InfoBar />
            <TimeSelector />
          </div>
          <div className="right-col">
            <Scheduled />
            <UpcomingEvents />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
requestAnimationFrame(() => typeof fit === 'function' && fit());
setTimeout(() => typeof fit === 'function' && fit(), 200);
</script>
</body>
</html>

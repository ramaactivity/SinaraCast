<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#fff;padding:24px;color:var(--ink-900)}
  .row{display:flex;gap:16px;align-items:flex-end}
  .b{background:var(--primary-100);border:1.5px solid var(--primary-300)}
  .it{text-align:center}
  .cap{font-size:10px;font-family:ui-monospace,monospace;color:var(--ink-500);margin-top:8px}
</style></head><body>
<div class="row">
  <div class="it"><div class="b" style="width:64px;height:64px;border-radius:var(--r-xs)"></div><div class="cap">xs · 8</div></div>
  <div class="it"><div class="b" style="width:64px;height:64px;border-radius:var(--r-sm)"></div><div class="cap">sm · 12</div></div>
  <div class="it"><div class="b" style="width:64px;height:64px;border-radius:var(--r-md)"></div><div class="cap">md · 16</div></div>
  <div class="it"><div class="b" style="width:64px;height:64px;border-radius:var(--r-lg)"></div><div class="cap">lg · 22</div></div>
  <div class="it"><div class="b" style="width:64px;height:64px;border-radius:var(--r-xl)"></div><div class="cap">xl · 28</div></div>
  <div class="it"><div class="b" style="width:64px;height:64px;border-radius:var(--r-pill)"></div><div class="cap">pill · 999</div></div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#fff;padding:24px;color:var(--ink-900)}
  .row{display:flex;gap:14px;align-items:flex-end}
  .it{text-align:center}
  .b{background:var(--green-200)}
  .cap{font-size:10px;font-family:ui-monospace,monospace;color:var(--ink-500);margin-top:8px}

<div class="row">

  <div class="it"><div class="b" style="width:12px;height:48px"></div><div class="cap">3·12</div></div>
  <div class="it"><div class="b" style="width:16px;height:48px"></div><div class="cap">4·16</div></div>
  <div class="it"><div class="b" style="width:20px;height:48px"></div><div class="cap">5·20</div></div>
  <div class="it"><div class="b" style="width:24px;height:48px"></div><div class="cap">6·24</div></div>
  <div class="it"><div class="b" style="width:32px;height:48px"></div><div class="cap">8·32</div></div>
</div>
</body></html>

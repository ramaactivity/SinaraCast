<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#F3F1FA;padding:22px;color:var(--ink-900)}
  .wrap{display:flex;gap:18px;align-items:flex-start}
  .nav{width:230px;background:var(--sidebar-glass);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:2px}
  .item{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:500;color:var(--ink-400);position:relative}
  .item.on{color:var(--primary-500);font-weight:600}
  .dot{position:absolute;right:12px;width:7px;height:7px;border-radius:50%;background:var(--primary-500)}
  svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tags{display:flex;flex-direction:column;gap:10px;padding-top:6px}
  .tag{align-self:flex-start;font-size:11px;font-weight:500;padding:4px 12px;border-radius:999px}
</style></head><body>
<div class="wrap">
  <div class="nav">
    <div class="item on"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Dashboard<span class="dot"></span></div>
    <div class="item"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>Calendar</div>
    <div class="item"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 9l1.5 1.5L13 7.5"/></svg>My Task</div>
  </div>
  <div class="tags">
    <span class="tag" style="background:rgba(140,144,158,.14);color:var(--ink-500)">Public</span>
    <span class="tag" style="background:var(--green-100);color:var(--green-500)">Confirmed</span>
    <span class="tag" style="background:var(--primary-100);color:#E0922A">Pending</span>
  </div>
</div>
</body></html>

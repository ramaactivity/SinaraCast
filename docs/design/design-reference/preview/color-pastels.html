<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font);background:#fff;padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:16px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;box-shadow:0 8px 20px rgba(90,96,120,.08)}
  .name{font-size:12px;font-weight:600;color:var(--ink-900)}
  .var{font-size:10px;font-family:ui-monospace,monospace;color:rgba(62,67,81,.6)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--card-yellow)"><span class="name">Yellow</span><span class="var">--card-yellow</span></div>
  <div class="sw" style="background:var(--card-mint)"><span class="name">Mint</span><span class="var">--card-mint</span></div>
  <div class="sw" style="background:var(--card-lilac)"><span class="name">Lilac</span><span class="var">--card-lilac</span></div>
  <div class="sw" style="background:var(--teal-grad);box-shadow:0 12px 24px rgba(84,188,160,.35)"><span class="name" style="color:#fff">Premium</span><span class="var" style="color:rgba(255,255,255,.8)">--teal-grad</span></div>
</div>
</body></html>

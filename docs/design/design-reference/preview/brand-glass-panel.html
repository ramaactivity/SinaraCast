<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:var(--app-bg);padding:24px;color:var(--ink-900)}
  .panel{max-width:300px;background:var(--glass-strong);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--shadow-md);padding:22px}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .hd b{font-weight:600;font-size:17px}
  .x{width:26px;height:26px;border-radius:50%;background:rgba(140,144,158,.12);color:var(--ink-400);display:grid;place-items:center;font-size:13px}
  .t{font-weight:600;font-size:15px}
  .sub{font-size:11.5px;color:var(--ink-400);margin-top:2px}
  .price{display:flex;justify-content:space-between;align-items:center;padding:13px 0;margin:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .price span:first-child{color:var(--ink-500);font-weight:500;font-size:13px}
  .price span:last-child{font-weight:600;font-size:15px}
  .btn{width:100%;margin-top:18px;height:46px;border:none;border-radius:14px;background:var(--green-grad);color:#fff;font-family:var(--font);font-weight:600;font-size:14px;box-shadow:var(--shadow-green)}
</style></head><body>
<div class="panel">
  <div class="hd"><b>Scheduled</b><span class="x">×</span></div>
  <div class="t">Introduction to UX Design</div>
  <div class="sub">Public</div>
  <div class="price"><span>Price :</span><span>$0</span></div>
  <button class="btn">Reschedule</button>
</div>
</body></html>

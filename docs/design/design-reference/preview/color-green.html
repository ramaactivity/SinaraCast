<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font);background:#fff;padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:14px;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;box-shadow:var(--shadow-sm)}
  .name{font-size:11px;font-weight:600}
  .hex{font-size:10px;font-family:ui-monospace,monospace;opacity:.85}
  .grad{margin-top:12px;height:54px;border-radius:14px;background:var(--green-grad);display:flex;align-items:flex-end;padding:10px 14px;color:#fff;font-size:11px;font-weight:600;box-shadow:var(--shadow-green)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--green-100)"><span class="name" style="color:#5C9A3F">100</span><span class="hex" style="color:#5C9A3F">#EAF7DD</span></div>
  <div class="sw" style="background:var(--green-200)"><span class="name" style="color:#4E8A33">200</span><span class="hex" style="color:#4E8A33">#CDEEAE</span></div>
  <div class="sw" style="background:var(--green-300)"><span class="name" style="color:#fff">300</span><span class="hex" style="color:#fff">#A8E06B</span></div>
  <div class="sw" style="background:var(--green-400)"><span class="name" style="color:#fff">400</span><span class="hex" style="color:#fff">#8FD96E</span></div>
  <div class="sw" style="background:var(--green-500)"><span class="name" style="color:#fff">500</span><span class="hex" style="color:#fff">#5FBE6B</span></div>
</div>
<div class="grad">--green-grad &nbsp;·&nbsp; #B5E886 → #82CF7E &nbsp;(primary action / Reschedule)</div>
</body></html>

<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font);background:#fff;padding:22px;color:var(--ink-900)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:14px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;border:1px solid var(--line)}
  .name{font-size:11px;font-weight:600}
  .hex{font-size:10px;font-family:ui-monospace,monospace;opacity:.85}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--ink-900)"><span class="name" style="color:#fff">ink-900</span><span class="hex" style="color:#fff">#3E4351</span></div>
  <div class="sw" style="background:var(--ink-700)"><span class="name" style="color:#fff">ink-700</span><span class="hex" style="color:#fff">#565C6B</span></div>
  <div class="sw" style="background:var(--ink-500)"><span class="name" style="color:#fff">ink-500</span><span class="hex" style="color:#fff">#8A909E</span></div>
  <div class="sw" style="background:var(--ink-400)"><span class="name" style="color:#fff">ink-400</span><span class="hex" style="color:#fff">#A6ABB6</span></div>
  <div class="sw" style="background:var(--ink-300)"><span class="name" style="color:var(--ink-700)">ink-300</span><span class="hex" style="color:var(--ink-700)">#C4C8D0</span></div>
</div>
</body></html>

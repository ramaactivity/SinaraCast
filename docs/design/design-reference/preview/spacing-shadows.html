<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;font-family:var(--font);background:#F6F5FB;padding:26px;color:var(--ink-900)}
  .row{display:flex;gap:22px}
  .it{text-align:center}
  .b{width:120px;height:74px;border-radius:16px;background:#fff}
  .cap{font-size:10px;font-family:ui-monospace,monospace;color:var(--ink-500);margin-top:10px}
</style></head><body>
<div class="row">
  <div class="it"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="cap">shadow-sm</div></div>
  <div class="it"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="cap">shadow-md</div></div>
  <div class="it"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="cap">shadow-lg</div></div>
  <div class="it"><div class="b" style="background:var(--primary-grad);box-shadow:var(--shadow-primary)"></div><div class="cap">shadow-primary</div></div>
  <div class="it"><div class="b" style="background:var(--green-grad);box-shadow:var(--shadow-green)"></div><div class="cap">shadow-green</div></div>
</div>
</body></html>

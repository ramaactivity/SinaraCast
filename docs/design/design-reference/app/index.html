<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content OS</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="content-os.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--app-bg); background-attachment: fixed; color: var(--ink-900); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #root { position: absolute; top: 50%; left: 50%; width: 1320px; height: 860px; transform-origin: center center; }
  .app-shell {
    display: flex; height: 100%; overflow: hidden;
    background: rgba(255,255,255,.28);
    backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    border: 1px solid rgba(255,255,255,.5);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-lg);
  }
  button { font-family: var(--font); }
  input, textarea, select { font-family: var(--font); }
  @keyframes cosPulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes cosShimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @keyframes cosSpin { to { transform: rotate(360deg) } }
  @keyframes cosFade { from{opacity:0} to{opacity:1} }
  @keyframes cosPop { from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none} }
  @keyframes cosToast { from{opacity:0; transform:transl(-50%,8px)} to{opacity:1} }
  @keyframes cosToast { from{opacity:0; transform:translateX(-50%) translateY(10px)} to{opacity:1; transform:translateX(-50%)} }
  @media (max-width: 1180px) { #root { padding: 0; } }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script>
  window.fit = function () {
    const r = document.getElementById('root');
    const s = Math.min((window.innerWidth) / r.offsetWidth, (window.innerHeight) / r.offsetHeight, 1);
    r.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  };
  window.addEventListener('resize', window.fit);
  window.addEventListener('load', () => { window.fit(); setTimeout(window.fit, 300); });
</script>

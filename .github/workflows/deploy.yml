name: Deploy to Vercel (Production)

# Why this exists instead of Vercel's native Git integration:
# One GitHub account can only be "login-connected" to a single Vercel account
# at a time. This repo deploys to a Vercel account that differs from other
# projects, so native Git integration keeps getting stolen/disconnected.
# Deploying via the Vercel CLI + a project-scoped token sidesteps that entirely.
#
# Org/Project IDs are inlined below (these are NOT secrets). The only secret you
# must add is VERCEL_TOKEN (repo Settings -> Secrets and variables -> Actions).
#
# Build runs REMOTELY on Vercel (no local `vercel build`): Vercel installs deps,
# applies the project's Root Directory (spike1), builds with its own cache, and
# injects env vars at build time exactly like the native integration. That makes
# the CI side minimal and avoids local build/env-pull edge cases.
#
# `rm -rf .git` before deploy is REQUIRED: otherwise the CLI attaches the commit
# author, and Vercel blocks the deployment on Hobby with "commit email could not
# be matched to a GitHub account" (this Vercel account has no GitHub linked, and
# Hobby has no collaborators). Removing .git strips that metadata, so the deploy
# is authorized purely by the token / token owner.

on:
  push:
    branches: [main]

# Never run two production deploys at the same time. A newer push cancels the
# in-flight one.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_DrIFTCibqzGWz5gnPFEDQ1mi
  VERCEL_PROJECT_ID: prj_jepDq5u6sM7xHG2LjAm0R54NRyt4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Strip git metadata so the deploy isn't blocked on the commit author.
      # The CLI deploys via VERCEL_ORG_ID/VERCEL_PROJECT_ID + token; it does not
      # need .git. Keep this AFTER `vercel pull` (pull writes to .vercel, not .git).
      - name: Drop git metadata (avoid Hobby commit-author block)
        run: rm -rf .git

      - name: Deploy (production, build on Vercel)
        run: vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
